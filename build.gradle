buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.9.1'
    }
}

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}


version = project.mod_version
group = project.maven_group

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"simple-distribution" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "me.shedaniel.cloth:cloth-config-fabric:26.1.154"
	implementation "com.terraformersmc:modmenu:${project.mod_menu_version}"

}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

task obfuscate(type: proguard.gradle.ProGuardTask) {
    dependsOn 'build'
    injars "${buildDir}/libs/${project.name}-${version}.jar"
    outjars "${buildDir}/libs/${project.name}-${version}-obf.jar"

    libraryjars configurations.runtimeClasspath
    libraryjars "${System.getProperty('java.home')}/jmods"

    keep 'class me.simplesort.Simplesort { *; }'
    keep 'class me.simplesort.client.SimplesortClient { *; }'
    keep 'class me.simplesort.client.ModMenuIntegration { *; }'
    keep 'class me.simplesort.config.** { *; }'

    keepattributes 'RuntimeVisibleAnnotations,RuntimeVisibleParameterAnnotations'
    dontoptimize
    dontwarn
}